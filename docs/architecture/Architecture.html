<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Warrant — deployed architecture</title>
<meta name="description" content="Every resource actually deployed in warrent-505918, drawn as a draggable graph and coloured by its verified state." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* ---------------------------------------------------------------------------
   Palette is lifted straight from design/tokens.json — this diagram belongs to
   the product it describes, so it uses the product's own colours. The four
   status hues are the provenance-class hues, reused here to mean "how true is
   this box right now".
   --------------------------------------------------------------------------- */
:root{
  --work:#131314; --work-2:#1E1F20; --work-3:#282A2C; --work-4:#303134;
  --rule-dark:#444746;
  --fg:#E3E3E3; --fg-2:#C4C7C5; --fg-3:#9AA0A6;
  --primary:#1A73E8; --primary-lift:#8AB4F8;
  --live:#1E8E3E;  --live-lift:#81C995;
  --prov:#E37400;  --prov-lift:#FDD663;
  --drift:#D93025; --drift-lift:#F28B82;
  --dorm:#5F6368;  --dorm-lift:#9AA0A6;
  /* The fleet's hue. Borrowed from the product's own provenance scale, where `asserted`
     means a claim somebody stands behind rather than a measurement \u2014 which is exactly the
     standing of code that runs and is tested but is not yet deployed here. */
  --asserted:#9334E6; --asserted-lift:#D7AEFB;
  --sans:"Google Sans","Google Sans Text","Product Sans",Roboto,Arial,sans-serif;
  --mono:"Google Sans Code","Roboto Mono",ui-monospace,monospace;
  --e2:0 1px 2px 0 rgba(0,0,0,.5), 0 2px 6px 2px rgba(0,0,0,.3);
  --e3:0 4px 8px 3px rgba(0,0,0,.35), 0 1px 3px 0 rgba(0,0,0,.5);
  --ease:cubic-bezier(.2,0,0,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--work); color:var(--fg);
  font-family:var(--sans); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button{font:inherit;color:inherit}

/* ------------------------------------------------------------------ chrome */
.chrome{
  position:fixed; inset:0 0 auto 0; z-index:30;
  display:flex; align-items:center; gap:20px; flex-wrap:wrap;
  padding:12px 20px; background:rgba(19,19,20,.86);
  backdrop-filter:blur(14px); border-bottom:1px solid var(--rule-dark);
}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.brand h1{
  margin:0; font-size:15px; font-weight:500; letter-spacing:-.01em; white-space:nowrap;
}
.brand h1 i{
  display:inline-block; width:9px; height:9px; margin-right:9px; border-radius:2px;
  background:var(--primary-lift); font-style:normal; vertical-align:baseline;
}
.brand p{
  margin:0; font-family:var(--mono); font-size:11px; color:var(--fg-3);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.tally{display:flex;gap:14px;margin-left:auto;flex-wrap:wrap}
.tally b{
  display:flex; align-items:center; gap:6px;
  font-family:var(--mono); font-size:11px; font-weight:500; color:var(--fg-2);
}
.tally b s{width:8px;height:8px;border-radius:999px;display:block}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tool{
  border:1px solid var(--rule-dark); background:var(--work-2); color:var(--fg-2);
  border-radius:999px; padding:6px 14px; font-size:12.5px; cursor:pointer;
  transition:background var(--ease) 150ms, color var(--ease) 150ms, border-color var(--ease) 150ms;
  white-space:nowrap;
}
.tool:hover{background:var(--work-3);color:var(--fg)}
.tool[aria-pressed="true"]{
  background:var(--primary); border-color:var(--primary); color:#fff;
}
.tool:focus-visible,.node:focus-visible,.leg li:focus-visible{
  outline:2px solid var(--primary-lift); outline-offset:2px;
}

/* ------------------------------------------------------------------ canvas */
#stage{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none}
#stage.panning{cursor:grabbing}
#stage::before{
  /* A faint engineering grid, so dragging a node reads as movement across a
     surface rather than a box drifting in a void. */
  content:""; position:absolute; inset:-200vh -200vw; pointer-events:none;
  background-image:
    linear-gradient(rgba(68,71,70,.16) 1px, transparent 1px),
    linear-gradient(90deg, rgba(68,71,70,.16) 1px, transparent 1px);
  background-size:40px 40px;
}
#world{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
#wires{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}

/* -------------------------------------------------------------------- band */
.band{
  position:absolute; border:1px dashed rgba(68,71,70,.85); border-radius:16px;
  pointer-events:none;
}
.band span{
  position:absolute; top:-9px; left:20px; padding:0 10px;
  background:var(--work); font-family:var(--mono); font-size:10.5px;
  letter-spacing:.14em; text-transform:uppercase; color:var(--fg-3);
}

/* -------------------------------------------------------------------- node */
.node{
  position:absolute; width:240px; padding:11px 14px 12px 16px;
  background:var(--work-2); border:1px solid var(--rule-dark); border-radius:12px;
  box-shadow:var(--e2); cursor:grab; user-select:none; overflow:hidden;
  transition:box-shadow 150ms var(--ease), border-color 150ms var(--ease),
             opacity 220ms var(--ease), background 150ms var(--ease);
}
.node::before{
  content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
  background:var(--accent);
}
.node:hover{border-color:var(--fg-3);box-shadow:var(--e3)}
.node.dragging{cursor:grabbing;box-shadow:var(--e3);border-color:var(--primary-lift);z-index:20}
.node[data-sel="1"]{border-color:var(--primary-lift);background:var(--work-3);box-shadow:var(--e3)}
.node h3{
  margin:0; font-size:13.5px; font-weight:500; letter-spacing:-.005em;
  color:var(--fg); display:flex; align-items:center; gap:7px;
}
.node h3 s{
  width:7px;height:7px;border-radius:999px;background:var(--accent);flex:none;
  text-decoration:none;
}
.node p{
  margin:5px 0 0; font-family:var(--mono); font-size:10.5px; line-height:1.45;
  color:var(--fg-3); word-break:break-word;
}
.node em{
  display:inline-block; margin-top:8px; padding:2px 8px; border-radius:999px;
  font-style:normal; font-family:var(--mono); font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--accent-lift);
  background:color-mix(in srgb, var(--accent) 18%, transparent);
  border:1px solid color-mix(in srgb, var(--accent) 40%, transparent);
}
.node.dim{opacity:.16}

/* ------------------------------------------------------------------- wires */
.wire{fill:none;stroke-width:1.6;transition:opacity 220ms var(--ease),stroke-width 150ms var(--ease)}
.wire.dim{opacity:.08}
.wire.hot{stroke-width:2.6}
.flow{
  stroke-dasharray:5 9; stroke-linecap:round;
  animation:flow 1.1s linear infinite;
}
@keyframes flow{to{stroke-dashoffset:-14}}
.wlabel{
  font-family:var(--mono); font-size:10px; fill:var(--fg-2);
  paint-order:stroke; stroke:var(--work); stroke-width:5px; stroke-linejoin:round;
  transition:opacity 220ms var(--ease);
}
.wlabel.dim{opacity:0}

/* ------------------------------------------------------------------- panel */
.panel{
  position:fixed; top:0; right:0; bottom:0; width:min(390px,90vw); z-index:40;
  background:var(--work-2); border-left:1px solid var(--rule-dark);
  box-shadow:-8px 0 32px rgba(0,0,0,.5);
  transform:translateX(101%); transition:transform 280ms var(--ease);
  display:flex; flex-direction:column;
}
.panel.open{transform:none}
.panel header{
  padding:22px 24px 16px; border-bottom:1px solid var(--rule-dark);
  border-left:3px solid var(--accent);
}
.panel header em{
  display:inline-block; margin-bottom:10px; padding:2px 9px; border-radius:999px;
  font-style:normal; font-family:var(--mono); font-size:9.5px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--accent-lift);
  background:color-mix(in srgb, var(--accent) 18%, transparent);
  border:1px solid color-mix(in srgb, var(--accent) 40%, transparent);
}
.panel h2{margin:0;font-size:17px;font-weight:500;letter-spacing:-.01em}
.panel header p{margin:6px 0 0;font-family:var(--mono);font-size:11px;color:var(--fg-3);word-break:break-word}
.panel .body{padding:6px 24px 40px;overflow-y:auto;flex:1}
.panel dl{margin:0;display:grid;grid-template-columns:112px 1fr;gap:0}
.panel dt,.panel dd{
  padding:9px 0; border-bottom:1px solid rgba(68,71,70,.5); margin:0;
  font-size:12px; min-width:0;
}
.panel dt{
  color:var(--fg-3);font-family:var(--mono);font-size:10.5px;padding-right:12px;
  letter-spacing:.02em;overflow-wrap:anywhere;
}
.panel dd{color:var(--fg-2);font-family:var(--mono);font-size:11px;word-break:break-word}
.panel .note{
  margin:20px 0 0; padding:13px 15px; border-radius:10px; font-size:12.5px; line-height:1.6;
  background:color-mix(in srgb, var(--accent) 10%, var(--work-3));
  border:1px solid color-mix(in srgb, var(--accent) 32%, transparent);
  color:var(--fg-2);
}
.panel .note b{color:var(--accent-lift);font-weight:500}
.panel h4{
  margin:26px 0 8px; font-family:var(--mono); font-size:10px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--fg-3); font-weight:500;
}
.panel ul{margin:0;padding:0;list-style:none}
.panel ul li{
  padding:7px 0 7px 16px; border-bottom:1px solid rgba(68,71,70,.5);
  font-family:var(--mono); font-size:11px; color:var(--fg-2); position:relative;
}
.panel ul li::before{
  content:""; position:absolute; left:0; top:14px;
  width:6px; height:1px; background:var(--fg-3);
}
.shut{
  position:absolute; top:16px; right:16px; width:30px; height:30px; border-radius:999px;
  border:1px solid var(--rule-dark); background:var(--work-3); cursor:pointer;
  font-size:15px; line-height:1; color:var(--fg-3);
}
.shut:hover{color:var(--fg);border-color:var(--fg-3)}

/* ------------------------------------------------------------------ legend */
.leg{
  position:fixed; left:20px; bottom:20px; z-index:30;
  background:rgba(30,31,32,.9); backdrop-filter:blur(14px);
  border:1px solid var(--rule-dark); border-radius:14px; padding:14px 16px;
  max-width:330px;
}
.leg h5{
  margin:0 0 10px; font-family:var(--mono); font-size:10px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--fg-3); font-weight:500;
  display:flex; align-items:center; justify-content:space-between; gap:14px;
}
.leg h5 button{
  border:0; background:none; padding:0; cursor:pointer; color:var(--primary-lift);
  font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:none;
}
.leg h5 button:hover{text-decoration:underline}
/* Definitions are opt-in: the diagram needs the floor space more than the prose. */
.leg li span{display:none}
.leg.verbose li span{display:block}
.leg ul{margin:0;padding:0;list-style:none;display:grid;gap:7px}
.leg li{
  display:grid; grid-template-columns:9px 1fr; gap:9px; align-items:start;
  font-size:11.5px; color:var(--fg-2); cursor:pointer; border-radius:6px;
  padding:2px 4px; margin:-2px -4px;
  transition:background 150ms var(--ease), opacity 150ms var(--ease);
}
.leg li:hover{background:var(--work-3)}
.leg li[aria-pressed="true"]{background:var(--work-4)}
.leg li.muted{opacity:.4}
.leg li s{width:9px;height:9px;border-radius:999px;margin-top:5px;text-decoration:none}
.leg li b{font-weight:500;color:var(--fg)}
.leg li span{color:var(--fg-3);font-size:10.5px;line-height:1.4}
.leg footer{
  margin-top:12px; padding-top:11px; border-top:1px solid rgba(68,71,70,.6);
  font-family:var(--mono); font-size:10px; color:var(--fg-3); line-height:1.6;
}
.hint{
  position:fixed; right:20px; bottom:20px; z-index:29;
  font-family:var(--mono); font-size:10.5px; color:var(--fg-3);
  background:rgba(30,31,32,.86); backdrop-filter:blur(10px);
  border:1px solid var(--rule-dark); border-radius:999px; padding:8px 15px;
  transition:opacity 400ms var(--ease);
}
.hint.gone{opacity:0;pointer-events:none}

@media (max-width:820px){
  .tally{display:none}
  .hint{display:none}
  /* On a phone the graph is a pan-and-zoom surface, so the legend gives up its
     floor space and becomes one row of counts. */
  .leg{left:12px;right:12px;bottom:12px;max-width:none;padding:10px 13px}
  .leg h5{margin-bottom:9px}
  .leg h5 button{display:none}
  .leg ul{grid-template-columns:repeat(4,auto);justify-content:space-between;gap:4px}
  .leg li span{display:none}
  .leg li b{font-size:11px}
  .leg footer{margin-top:9px;padding-top:9px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
</style>
</head>
<body>

<div class="chrome">
  <div class="brand">
    <h1><i></i>Warrant — deployed architecture</h1>
    <p id="stamp">project warrent-505918 · us-central1 · verified 2026-08-19</p>
  </div>
  <div class="tally" id="tally"></div>
  <div class="tools">
    <button class="tool" id="btnTrace" aria-pressed="false">Trace a live request</button>
    <button class="tool" id="btnLabels" aria-pressed="false">All labels</button>
    <button class="tool" id="btnFit">Fit</button>
    <button class="tool" id="btnReset">Reset layout</button>
  </div>
</div>

<div id="stage">
  <div id="world">
    <svg id="wires" aria-hidden="true"></svg>
  </div>
</div>

<aside class="panel" id="panel" aria-live="polite">
  <button class="shut" id="shut" aria-label="Close details">×</button>
  <header>
    <em id="pState"></em>
    <h2 id="pTitle"></h2>
    <p id="pSub"></p>
  </header>
  <div class="body">
    <dl id="pFacts"></dl>
    <p class="note" id="pNote"></p>
    <div id="pListWrap" hidden>
      <h4 id="pListTitle"></h4>
      <ul id="pList"></ul>
    </div>
  </div>
</aside>

<div class="leg" id="leg">
  <h5>State, as verified <button id="btnWhy" aria-expanded="false">what these mean</button></h5>
  <ul id="legend"></ul>
  <footer id="legFoot"></footer>
</div>

<div class="hint" id="hint">Drag nodes · drag the grid to pan · scroll to zoom</div>

<script>
(() => {
"use strict";

/* =========================================================================
   The data. Every value below was read out of project warrent-505918 with
   gcloud or the REST APIs on 2026-08-19, or by requesting the live service.
   Nothing here is inferred from the repository — where the repository and the
   project disagree, the project wins and the node is marked `drift`.
   ========================================================================= */

const STATE = {
  live:  {c:"var(--live)",  l:"var(--live-lift)",  label:"Live",        blurb:"Carrying real traffic right now."},
  prov:  {c:"var(--prov)",  l:"var(--prov-lift)",  label:"Provisioned", blurb:"Healthy and reachable, but no real data or traffic passes through it."},
  drift: {c:"var(--drift)", l:"var(--drift-lift)", label:"Drift",       blurb:"The deployed state contradicts the repository, or a documented path fails."},
  dorm:  {c:"var(--dorm)",  l:"var(--dorm-lift)",  label:"Dormant",     blurb:"API enabled, zero resources. Nothing to call."},
  hub:   {c:"var(--primary)",l:"var(--primary-lift)",label:"Project",   blurb:"The project envelope itself."},
  bench: {c:"var(--asserted)",l:"var(--asserted-lift)",label:"On the bench",
          blurb:"Real code making real calls into this project, and answering a recorded suite \u2014 but run from a developer machine, not from anything deployed here."},
};

const BANDS = [
  {t:"Supply chain — how the image got there",              ids:["laptop","ar","gcs","imgweb","imgsite"]},
  {t:"Identity — provisioned, never exercised",             ids:["idp","webapp","google","anon","domains"]},
  {t:"Request path — what a visitor actually touches",      ids:["browser","gfe","run","invoker","rev","runsa","next","src","routes","apiauth"]},
  {t:"Platform services — enabled, unused",                 ids:["armor","vertex","apis","pubsub","obs","secrets"]},
  {t:"Data — provisioned, empty",                           ids:["fs","idx","rules","sawe","saadm"]},
  {t:"The agent fleet — seven, on the bench",                ids:["scoper","inspector","skeptic","instructor","foreman","auditor","wright"]},
];

const NODES = [
  /* ---------------------------------------------------- supply chain */
  {id:"laptop", x:50, y:80, s:"live", t:"Developer laptop", sub:"podman/docker build · linux/amd64",
   facts:[["role","builds and pushes the image"],["why not Cloud Build","new projects have no Cloud Build SA; `builds submit` fails PERMISSION_DENIED"],["source","infra/deploy-web.sh"]],
   note:"The build host is outside Google Cloud entirely. <b>Cloud Build is enabled but never runs</b> — the image is built locally and pushed straight to Artifact Registry."},

  {id:"ar", x:350, y:80, s:"live", t:"Artifact Registry", sub:"warrant · Docker · us-central1",
   facts:[["repository","warrant"],["format","DOCKER"],["location","us-central1"],["size","98.2 MB"],["images","2 (web, site)"]],
   note:"Holds every image the project has ever run. Cloud Run pulls from here at cold start."},

  {id:"imgweb", x:650, y:80, s:"live", t:"web:20260819-234815", sub:"the image now serving",
   facts:[["pushed","2026-08-19 16:48:59 -0700"],["base","node:22-alpine"],["build","Next.js output: standalone"],["digest tag","20260819-234815"]],
   note:"A two-stage build: the runtime layer carries the standalone server and its reachable node_modules only — no toolchain, no dev dependencies."},

  {id:"imgsite", x:650, y:230, s:"prov", t:"site:20260818-192615", sub:"superseded static site",
   facts:[["pushed","2026-08-18 12:26:32"],["traffic","none"],["replaced by","web:20260819-234815"]],
   note:"The static site this app replaced in commit <b>161bdfa</b>. Still in the registry, no longer referenced by any revision."},

  {id:"gcs", x:350, y:230, s:"dorm", t:"Cloud Storage", sub:"warrent-505918_cloudbuild · US",
   facts:[["bucket","warrent-505918_cloudbuild"],["location","US multi-region"],["created by","Cloud Build API enablement"],["used by","nothing"]],
   note:"Auto-created when the Cloud Build API was enabled. <b>No build has ever staged through it</b>, because the image is built on the laptop."},

  /* ---------------------------------------------------- request path */
  {id:"browser", x:50, y:430, s:"live", t:"Browser", sub:"any device · no account, no install",
   facts:[["auth","none required"],["entry","GET /"],["response","200 in ~0.37 s cold"]],
   note:"The deployed build asks nobody to sign in. Every screen renders for an anonymous visitor."},

  {id:"gfe", x:350, y:430, s:"live", t:"Google Front End", sub:"TLS termination · global anycast",
   facts:[["ingress","all"],["hostnames","warrant-zq2l2kwg3q-uc.a.run.app · warrant-1020487917587.us-central1.run.app"],["to container","plain HTTP :8080"]],
   note:"TLS stops here. The container never sees a certificate — which is why the Dockerfile only ever binds plain HTTP."},

  {id:"run", x:650, y:430, s:"live", t:"Cloud Run service", sub:"warrant · us-central1 · managed",
   facts:[["generation","1"],["concurrency","80"],["scale","min 0 · max 4"],["timeout","300 s"],["startup CPU boost","on"],["created","2026-08-19 23:49:04 UTC"],["creator","anthonybtedesco@gmail.com"]],
   note:"Scales to zero. No request means no container and no charge — a cold start costs about a second."},

  {id:"invoker", x:650, y:580, s:"live", t:"IAM — run.invoker", sub:"allUsers",
   facts:[["role","roles/run.invoker"],["member","allUsers"],["effect","the service is open to the public internet"]],
   note:"Deliberate: the demo has to be openable from a link. <b>There is no authentication in front of this service.</b>"},

  {id:"rev", x:950, y:430, s:"live", t:"Revision warrant-00001-rsd", sub:"100% traffic · the only revision",
   facts:[["cpu / memory","1 vCPU · 512 MiB"],["port","8080 (http1)"],["env vars","none set"],["ready","true"],["traffic","100%, latestRevision"]],
   note:"<b>No runtime environment variables are set on this revision.</b> The deploy script sets GCP_PROJECT, WARRANT_REGION and GOOGLE_OAUTH_CLIENT_ID — this revision predates that change."},

  {id:"runsa", x:950, y:580, s:"drift", t:"Runtime identity", sub:"1020487917587-compute@developer",
   facts:[["attached SA","default compute service account"],["its role","roles/editor"],["script intends","warrant-web@warrent-505918.iam"],["credentials","metadata server, short-lived"]],
   note:"<b>Drift.</b> infra/deploy-web.sh passes <code>--service-account warrant-web@…</code>, but the running revision uses the default compute account, which holds <b>roles/editor</b> over the whole project — far more than the least-privilege pair the script was written to attach."},

  {id:"next", x:1250, y:430, s:"live", t:"Next.js standalone server", sub:"node:22-alpine · server.js on :8080",
   facts:[["mode","output: standalone"],["process","node server.js, PID 1"],["static","/_next/static served in-process"],["images","Next image optimiser, on-box"]],
   note:"One process. No sidecar, no reverse proxy, no CDN in front of it beyond the Google Front End."},

  {id:"src", x:1250, y:580, s:"prov", t:"FixtureSource", sub:"in-process fixtures · fabricated = true",
   facts:[["binding","getDataSource() → FixtureSource"],["reason","no NEXT_PUBLIC_FIREBASE_* baked into the image"],["verified","no AIzaSy key appears in any served chunk"],["surfaces say so","yes — /about names it"]],
   note:"The deployed image carries <b>no Firebase web config</b>, so the browser binding falls back to fixtures. Every screen works end to end — on fabricated data, and it admits it."},

  {id:"routes", x:1550, y:430, s:"live", t:"Public routes", sub:"all verified 200",
   list:["GET /  — task picker","GET /about","GET /library","GET /job/[id]","GET /r/[id] — sealed record"],
   listTitle:"Responding 200 right now",
   facts:[["checked","2026-08-19, live service"],["renderer","React Server Components + client islands"]],
   note:"The whole product loop is reachable without an account: pick a task, work it, land on a sealed record."},

  {id:"apiauth", x:1550, y:580, s:"drift", t:"/api/auth/*", sub:"session · claim · dev-hd — all 404",

/* ------------------------------------------------------------ build bands */
// Created first so they sit behind the cards; sized later, once the cards have
// been measured, so a frame always wraps its own members however they are moved.
for (const b of BANDS) {
  b.el = document.createElement("div");
  b.el.className = "band";
  b.el.innerHTML = `<span>${b.t}</span>`;
  world.appendChild(b.el);

function layoutBands() {
  const PAD = 34, TOP = 40;
  for (const b of BANDS) {
    const ns = b.ids.map(id => byId.get(id));
    const x0 = Math.min(...ns.map(n => n.x)) - PAD;
    const y0 = Math.min(...ns.map(n => n.y)) - TOP;
    const x1 = Math.max(...ns.map(n => n.x + n.w)) + PAD;
    const y1 = Math.max(...ns.map(n => n.y + n.h)) + PAD;
    b.x = x0; b.y = y0; b.w = x1 - x0; b.h = y1 - y0;
    Object.assign(b.el.style, {left:x0+"px", top:y0+"px", width:b.w+"px", height:b.h+"px"});
  }
}

/* ------------------------------------------------------------ build nodes */
for (const n of NODES) {

/* ------------------------------------------------------------ build wires */
const wires = EDGES.map(([a, b, s, label]) => {
  const st = STATE[s];
  const p = document.createElementNS(SVG_NS, "path");
  p.setAttribute("class", "wire" + (s === "live" ? " flow" : ""));

/* ------------------------------------------------- orthogonal wire router */
function anchors(a, b) {
  const acx = a.x + a.w/2, acy = a.y + a.h/2;
  const bcx = b.x + b.w/2, bcy = b.y + b.h/2;
  const dx = bcx - acx, dy = bcy - acy;
  if (Math.abs(dx) >= Math.abs(dy)) {
    return dx >= 0
      ? {s:{x:a.x+a.w, y:acy}, t:{x:b.x, y:bcy}, axis:"h", fwd:(b.x > a.x+a.w+30)}
      : {s:{x:a.x, y:acy}, t:{x:b.x+b.w, y:bcy}, axis:"h", fwd:(a.x > b.x+b.w+30)};
  }
  return dy >= 0
    ? {s:{x:acx, y:a.y+a.h}, t:{x:bcx, y:b.y}, axis:"v", fwd:(b.y > a.y+a.h+30)}
    : {s:{x:acx, y:a.y}, t:{x:bcx, y:b.y+b.h}, axis:"v", fwd:(a.y > b.y+b.h+30)};
}

function points(a, b) {
  const {s, t, axis, fwd} = anchors(a, b);
  if (axis === "h") {
    if (fwd) { const m = (s.x + t.x) / 2; return [s, {x:m,y:s.y}, {x:m,y:t.y}, t]; }
    // Doubling back: step out, run along a lane clear of both cards, step in.
    const out = s.x + (t.x > s.x ? 30 : -30);
    const inn = t.x + (t.x > s.x ? -30 : 30);
    const lane = Math.max(a.y + a.h, b.y + b.h) + 34;
    return [s, {x:out,y:s.y}, {x:out,y:lane}, {x:inn,y:lane}, {x:inn,y:t.y}, t];
  }
  if (fwd) { const m = (s.y + t.y) / 2; return [s, {x:s.x,y:m}, {x:t.x,y:m}, t]; }
  const out = s.y + (t.y > s.y ? 26 : -26);
  const inn = t.y + (t.y > s.y ? -26 : 26);
  const lane = Math.max(a.x + a.w, b.x + b.w) + 34;
  return [s, {x:s.x,y:out}, {x:lane,y:out}, {x:lane,y:inn}, {x:t.x,y:inn}, t];
}

function round(pts, r) {
  const p = pts.filter((q, i) => i === 0 || Math.hypot(q.x-pts[i-1].x, q.y-pts[i-1].y) > 0.5);
  if (p.length < 3) return `M${p[0].x},${p[0].y} L${p[p.length-1].x},${p[p.length-1].y}`;
  let d = `M${p[0].x},${p[0].y}`;
  for (let i = 1; i < p.length - 1; i++) {
    const pr = p[i-1], c = p[i], nx = p[i+1];
    const d1 = Math.hypot(c.x-pr.x, c.y-pr.y), d2 = Math.hypot(nx.x-c.x, nx.y-c.y);
    const rr = Math.min(r, d1/2, d2/2);
    d += ` L${c.x+(pr.x-c.x)/d1*rr},${c.y+(pr.y-c.y)/d1*rr}`;
    d += ` Q${c.x},${c.y} ${c.x+(nx.x-c.x)/d2*rr},${c.y+(nx.y-c.y)/d2*rr}`;
  }
  const l = p[p.length-1];
  return d + ` L${l.x},${l.y}`;
}

/** Does this label's own box land on a card? */
function boxHitsCard(x0, y0, x1, y1) {
  for (const n of NODES) {
    if (x1 > n.x - 3 && x0 < n.x + n.w + 3 && y1 > n.y - 3 && y0 < n.y + n.h + 3) return true;
  }
  return false;
}

function drawWires() {
  layoutBands();
  for (const w of wires) {
    const a = byId.get(w.a), b = byId.get(w.b);
    const pts = points(a, b);
    w.p.setAttribute("d", round(pts, 12));
    if (w.tx) {
      // Halfway along the wire by arc length, not by segment — on a long
      // dog-leg that keeps the label near the middle of the run instead of
      // stranding it on whichever straight happens to be longest. If the
      // midpoint lands on a card, slide along the wire until it clears one.
      // Text width never changes, so measure it once — getComputedTextLength
      // forces a layout, and this runs on every frame of a drag.
      if (w.hw == null) w.hw = (w.tx.getComputedTextLength() || 60) / 2;
      const hw = w.hw, L = w.p.getTotalLength();
      let p = null;
      outer:
      for (const f of [0.5, 0.36, 0.64, 0.24, 0.76]) {
        const q = w.p.getPointAtLength(L * f);
        for (const dx of [0, hw + 16, -(hw + 16)]) {
          const cx = q.x + dx, cy = q.y - 7;
          if (!boxHitsCard(cx - hw, cy - 9, cx + hw, cy + 3)) { p = {x:cx, y:cy}; break outer; }
        }
      }
      if (!p) { const q = w.p.getPointAtLength(L / 2); p = {x:q.x, y:q.y - 7}; }
      w.tx.setAttribute("x", p.x);
      w.tx.setAttribute("y", p.y);
    }
  }
}

/* ----------------------------------------------------------- emphasis pass */
function refresh() {
  const focus = selected;
  for (const n of NODES) {
    const off = hidden.has(n.s) || (tracing && !TRACE_N.has(n.id));
    n.el.classList.toggle("dim", off);
    n.el.dataset.sel = (focus === n.id) ? "1" : "0";
  }
  for (const w of wires) {
    const off = hidden.has(w.s) || hidden.has(byId.get(w.a).s) || hidden.has(byId.get(w.b).s)
             || (tracing && !TRACE_E.has(w.key));
    const hot = focus && (w.a === focus || w.b === focus);
    w.p.classList.toggle("dim", off && !hot);
    w.p.classList.toggle("hot", !!hot);
    if (w.tx) {
      // Drift labels always show — that is the point of the drawing.
      const show = !off && (allLabels || w.s === "drift" || hot);
      w.tx.classList.toggle("dim", !show);
    }
  }
}

/* --------------------------------------------------------------- transform */
function applyView() {
  world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.k})`;
}

function bounds() {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of NODES) {
    x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y);
    x1 = Math.max(x1, n.x + n.w); y1 = Math.max(y1, n.y + n.h);
  }
  for (const b of BANDS) {
    x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y);
    x1 = Math.max(x1, b.x + b.w); y1 = Math.max(y1, b.y + b.h);
  }
  return {x0, y0, w: x1-x0, h: y1-y0};
}

function fit() {
  const b = bounds();
  const pad = 40;
  // Reserve the chrome and the legend card, so fitting never tucks a node
  // underneath a piece of furniture.
  // +34 on top clears the band captions, which sit above their frames and so
  // fall outside the measured bounds.
  const top = document.querySelector(".chrome").offsetHeight + 34;
  const bot = document.getElementById("leg").offsetHeight + 32;
  const availW = innerWidth - pad*2, availH = innerHeight - top - bot;
  // Below a floor the cards stop being readable, and a graph you cannot read is
  // worth less than one you have to pan. On a phone, pan.
  const floor = innerWidth < 900 ? 0.7 : 0.2;
  const k = Math.max(floor, Math.min(availW / b.w, availH / b.h, 1.15));
  view.k = k;
  const over = (avail, size) => size*k > avail ? 0 : (avail - size*k)/2;
  view.x = pad + over(availW, b.w) - b.x0*k;
  view.y = top + over(availH, b.h) - b.y0*k;
  applyView();
}

/* ------------------------------------------------------------- interaction */
let drag = null;

stage.addEventListener("pointerdown", (e) => {
  const nodeEl = e.target.closest(".node");
  if (nodeEl) {
    const n = byId.get(nodeEl.dataset.id);
    drag = {kind:"node", n, ox:e.clientX, oy:e.clientY, sx:n.x, sy:n.y, moved:false};
    nodeEl.classList.add("dragging");
  } else {
    drag = {kind:"pan", ox:e.clientX, oy:e.clientY, sx:view.x, sy:view.y, moved:false};
    stage.classList.add("panning");
  }
  stage.setPointerCapture(e.pointerId);
  document.getElementById("hint").classList.add("gone");
});

stage.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.ox, dy = e.clientY - drag.oy;
  if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
  if (drag.kind === "node") {
    drag.n.x = drag.sx + dx / view.k;
    drag.n.y = drag.sy + dy / view.k;
    drag.n.el.style.left = drag.n.x + "px";
    drag.n.el.style.top  = drag.n.y + "px";
    drawWires();
  } else {
    view.x = drag.sx + dx;
    view.y = drag.sy + dy;
    applyView();
  }
});

stage.addEventListener("pointerup", (e) => {
  if (!drag) return;
  if (drag.kind === "node") {
    drag.n.el.classList.remove("dragging");
    if (!drag.moved) open(drag.n.id);
  } else {
    stage.classList.remove("panning");
    if (!drag.moved) close();
  }
  drag = null;
  stage.releasePointerCapture(e.pointerId);
});

stage.addEventListener("wheel", (e) => {
  e.preventDefault();
  const k = Math.min(2.4, Math.max(0.25, view.k * Math.exp(-e.deltaY * 0.0016)));
  // Zoom about the cursor, so the thing under the pointer stays put.
  view.x = e.clientX - (e.clientX - view.x) * (k / view.k);
  view.y = e.clientY - (e.clientY - view.y) * (k / view.k);
  view.k = k;
  applyView();
}, {passive:false});

// Keyboard: focus a card, nudge it, Enter to inspect.
world.addEventListener("keydown", (e) => {
  const el = e.target.closest(".node");
  if (!el) return;
  const n = byId.get(el.dataset.id);
  const step = e.shiftKey ? 40 : 10;
  const map = {ArrowLeft:[-step,0], ArrowRight:[step,0], ArrowUp:[0,-step], ArrowDown:[0,step]};
  if (map[e.key]) {
    e.preventDefault();
    n.x += map[e.key][0]; n.y += map[e.key][1];
    el.style.left = n.x + "px"; el.style.top = n.y + "px";
    drawWires();
  } else if (e.key === "Enter" || e.key === " ") {
    e.preventDefault(); open(n.id);
  }
});

/* -------------------------------------------------------------------- panel */
const panel = document.getElementById("panel");

function open(id) {
  const n = byId.get(id), st = STATE[n.s];
  selected = id;
  panel.style.setProperty("--accent", st.c);
  panel.style.setProperty("--accent-lift", st.l);
  document.getElementById("pState").textContent = st.label;
  document.getElementById("pTitle").textContent = n.t;
  document.getElementById("pSub").textContent = n.sub;
  document.getElementById("pFacts").innerHTML =
    n.facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
  document.getElementById("pNote").innerHTML = n.note;
  const wrap = document.getElementById("pListWrap");
  if (n.list) {
    wrap.hidden = false;
    document.getElementById("pListTitle").textContent = n.listTitle;
    document.getElementById("pList").innerHTML = n.list.map(x => `<li>${x}</li>`).join("");
  } else wrap.hidden = true;
  panel.classList.add("open");
  refresh();
}
function close() { selected = null; panel.classList.remove("open"); refresh(); }
document.getElementById("shut").addEventListener("click", close);
addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });

/* ------------------------------------------------------------------- chrome */
const counts = {};
for (const n of NODES) counts[n.s] = (counts[n.s] || 0) + 1;

document.getElementById("tally").innerHTML = ["live","bench","prov","drift","dorm"]
  .map(s => `<b><s style="background:${STATE[s].c}"></s>${counts[s]||0} ${STATE[s].label.toLowerCase()}</b>`)
  .join("");

document.getElementById("legend").innerHTML = ["live","bench","prov","drift","dorm"].map(s =>
  `<li data-s="${s}" role="button" tabindex="0" aria-pressed="false">
     <s style="background:${STATE[s].c}"></s>
     <div><b>${STATE[s].label} · ${counts[s]||0}</b><span>${STATE[s].blurb}</span></div>
   </li>`).join("");

document.getElementById("legFoot").innerHTML =
  `${NODES.length} nodes · ${EDGES.length} links<br>` +
  `infrastructure read from warrent-505918 on 2026-08-19<br>` +
  `the fleet read from agents/ on 2026-08-21 by running its suite`;

document.querySelectorAll(".leg li").forEach(li => {
  const toggle = () => {
    const s = li.dataset.s;
    hidden.has(s) ? hidden.delete(s) : hidden.add(s);
    li.classList.toggle("muted", hidden.has(s));
    li.setAttribute("aria-pressed", String(hidden.has(s)));
    refresh();
  };
  li.addEventListener("click", toggle);
  li.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
  });
});

const btnTrace = document.getElementById("btnTrace");
btnTrace.addEventListener("click", () => {
  tracing = !tracing;
  btnTrace.setAttribute("aria-pressed", String(tracing));
  refresh();
});

const btnLabels = document.getElementById("btnLabels");
btnLabels.addEventListener("click", () => {
  allLabels = !allLabels;
  btnLabels.setAttribute("aria-pressed", String(allLabels));
  refresh();
});

const btnWhy = document.getElementById("btnWhy");
btnWhy.addEventListener("click", () => {
  const on = document.getElementById("leg").classList.toggle("verbose");
  btnWhy.setAttribute("aria-expanded", String(on));
  btnWhy.textContent = on ? "hide" : "what these mean";
});

document.getElementById("btnFit").addEventListener("click", fit);

document.getElementById("btnReset").addEventListener("click", () => {
  for (const n of NODES) {
    const h = home.get(n.id);
    n.x = h.x; n.y = h.y;
    n.el.style.left = n.x + "px"; n.el.style.top = n.y + "px";
  }
  drawWires(); fit();
});

addEventListener("resize", () => { /* keep the current view; just re-measure wires */ drawWires(); });

function relayout() {
  // Card heights and the header's wrap point both move once the web fonts
  // land, so measure again rather than trusting the fallback metrics.
  for (const n of NODES) { n.w = n.el.offsetWidth; n.h = n.el.offsetHeight; }
  drawWires();
  fit();
}

drawWires();
refresh();
fit();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
setTimeout(() => document.getElementById("hint").classList.add("gone"), 9000);
})();
</script>
</body>
</html>
