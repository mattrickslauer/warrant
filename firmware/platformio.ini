; Flashing the reference instrument without an IDE.
;
;   cd firmware && pio run -t upload && pio device monitor
;
; `src_dir = .` points PlatformIO at this directory so it compiles the .ino in place — there is
; one sketch and it is the product, so a src/ subdirectory would only hide it.
;
; The platform is PINNED. espressif32 6.5.x ships arduino-esp32 2.0.x, whose
; BLEServerCallbacks::onDisconnect takes (BLEServer*). Core 3.x added a second parameter, and
; the sketch marks the override, so an unpinned build fails to compile on a newer core.

[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32@~6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
