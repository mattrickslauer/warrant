server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript;
    gzip_min_length 512;

    # The page is one file and changes on deploy — cache briefly, revalidate.
    location / {
        add_header Cache-Control "public, max-age=300, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
